<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<link rel="preload" as="image" href="off/hero_s.webp" fetchpriority="high">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Arcaea 国服 · 最近成绩</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="alternate icon" href="favicon.ico">
<style>
:root{--bg:#f6f4fb;--panel:#fff;--line:#eae7f0;--pink:#d3459a;--cyan:#2bb8d4;--purple:#6b3fa0;--txt:#2b2733;--dim:#938fa0}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);
  font-family:"Exo 2","Segoe UI","Microsoft YaHei",system-ui,sans-serif}
.topnav{position:absolute;left:0;right:0;top:0;z-index:3;display:flex;align-items:center;justify-content:space-between;
    gap:16px;padding:16px clamp(16px,3.6vw,52px)}
  .topnav .lg{height:clamp(26px,3vw,42px);width:auto;filter:drop-shadow(0 1px 3px rgba(0,0,0,.22))}
  .topnav ul{display:flex;gap:clamp(12px,2.4vw,40px);list-style:none;font-size:clamp(11px,1.1vw,14px);
    letter-spacing:.05em;font-weight:700;color:#3d3748;text-shadow:0 1px 2px rgba(255,255,255,.7)}
  .topnav li{padding-bottom:3px;border-bottom:2px solid transparent}
  .topnav li.on{border-bottom-color:var(--pink)}
  .topnav a{color:inherit;text-decoration:none}
  .topnav a:hover{color:var(--pink)}
  .head{position:relative;margin:0 -16px;height:clamp(200px,26vw,330px);background:#e9ecf5}
.head img{width:100%;height:100%;object-fit:cover;object-position:center 38%;display:block;opacity:.95}
.head .mk{position:absolute;left:50%;bottom:-44px;transform:translateX(-50%);
  background:#fff;padding:13px 46px;clip-path:polygon(9% 0,91% 0,100% 50%,91% 100%,9% 100%,0 50%);
  box-shadow:0 6px 24px rgba(60,40,100,.14);text-align:center;min-width:220px}
.head .mk b{display:block;font-size:26px;letter-spacing:.04em;color:#1d0b2e}
.head .mk small{display:block;margin-top:5px;font-size:10px;letter-spacing:.28em;color:var(--dim)}
.wrap{max-width:1100px;margin:0 auto;padding:52px 18px 40px}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:18px}
.tools textarea{flex:1;min-width:240px;height:44px;resize:vertical;padding:8px 10px;border:1px solid var(--line);
  border-radius:10px;font-family:ui-monospace,Consolas,monospace;font-size:11px}
button{border:1px solid var(--line);background:#fff;color:var(--txt);padding:9px 16px;border-radius:10px;
  font-size:13px;cursor:pointer;font-family:inherit;transition:.15s}
button:hover{border-color:#d6cfef;background:#faf8ff}
button.p{background:linear-gradient(135deg,#8b5cf6,#ec4899);border:0;color:#fff;font-weight:600}
button.p:hover{filter:brightness(1.06)}
.who{font-size:13px;color:var(--purple);font-weight:600;letter-spacing:.04em;margin:-10px 0 16px}.who.hide{display:none}
  .note{font-size:12px;color:var(--dim);margin:0 0 16px}
.list{display:flex;flex-direction:column;gap:14px}

/* ===== 单条成绩卡片 ===== */
.rc{display:flex;gap:24px;background:var(--panel);border:1px solid var(--line);border-radius:20px;
  padding:26px;box-shadow:0 4px 24px rgba(80,60,130,.08);position:relative;overflow:hidden}
.rc::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;
  background:linear-gradient(180deg,#8b5cf6,#ec4899);opacity:.75}
.rc .cov{width:148px;height:148px;flex:none;border-radius:16px;object-fit:cover;background:#f1eef8;position:relative}
.rc .cov.ph{display:flex;align-items:center;justify-content:center;font-size:26px;color:#c9c1dd}
.rc .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:7px;justify-content:center}
.rc .r1{display:flex;align-items:baseline;gap:10px}
.rc .r1 .ttl{font-size:26px;font-weight:600;letter-spacing:.01em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.rc .r1 .no{font-size:13px;font-weight:700;color:#cdc6dd;flex:none}
.rc .r2{display:flex;align-items:center;gap:8px}
.rc .cc{font:700 14px ui-monospace,Consolas,monospace;color:#6b3fa0;
  background:#f3eefb;border-radius:6px;padding:2px 10px}
.rc .dif{font-size:13px;letter-spacing:.10em;color:var(--dim);letter-spacing:.06em;text-transform:uppercase}
.rc .r3{display:flex;align-items:baseline;gap:16px;margin-top:4px}
.rc .sc{font:700 40px ui-monospace,Consolas,monospace;letter-spacing:.01em;line-height:1.05}
.rc .cm{font-size:13px;font-weight:700;letter-spacing:.06em;padding:4px 13px;border-radius:6px;flex:none}
.rc .r4{font-size:14px;color:#8a839c;font-variant-numeric:tabular-nums}
.rc .r4 .fl{color:#e07a7a}
.rc .r5{display:flex;align-items:center;gap:10px;font-size:14px;margin-top:3px}
.rc .dg{font-weight:700;font-variant-numeric:tabular-nums}
.rc .dg.up{color:#1f9d6b}
.rc .dg.dn{color:#d3626c}
.rc .dg.new{color:#b9b0cc;font-weight:600}
.rc .pot{margin-left:auto;font:700 15px ui-monospace,Consolas,monospace;color:#8b5cf6;
  background:#f6f1ff;border-radius:8px;padding:4px 12px;flex:none}

/* 判定配色 */
.cm.pm{background:#efe4fb;color:#7c3aed}
.cm.fc{background:#e2f6fa;color:#0e90ad}
.cm.tc{background:#e8edfb;color:#4557b8}
.cm.ec{background:#fdf3dd;color:#a97a12}
.cm.hc{background:#fde8f1;color:#b02f74}
.cm.tl{background:#f8e6e8;color:#c0414b}

@media(max-width:640px){
  .rc{padding:13px;gap:12px}
  .rc .cov{width:76px;height:76px}
  .rc .sc{font-size:20px}
  .rc .r1 .ttl{font-size:16px}
}
</style>
</head>
<body>
<div class="head">
  <div class="topnav">
    <img class="lg" src="off/logo.png" alt="Arcaea">
    <ul>
      <li><a href="index.html">成绩查询</a></li>
      <li><a href="rank.html">难度排行</a></li>
      <li class="on">最近成绩</li>
      <li><a href="tool.html">提取工具</a></li>
    </ul>
  </div>
  <img src="off/hero_s.webp" alt="" fetchpriority="high" decoding="async">
  <div class="mk"><b>最近成绩</b><small>RECENT SCORES</small></div>
</div>

<div class="wrap">
  <div class="tools">
    <textarea id="csv" placeholder="粘贴 scores.csv 内容，或从查询页带过来…"></textarea>
    <button class="p" id="parse">渲染</button>
    <button id="exp">导出图片</button>
  </div>
  <p class="note" id="note">请先进行成绩查询喵 —— 回到「成绩查询」页查一次，或者把 scores.csv 粘进上面的框。</p>
  <p class="who hide" id="who"></p>
  <div class="list" id="list"></div>
</div>
<script>
var SONG = {}, ROWS = [], PREV = {}, LIMIT = 1;
var LAST_NAME = '', LAST_RATE = '';
var CONST_FIX = 0.4;

/* ---------- 工具 ---------- */
function $(s){ return document.querySelector(s); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

function splitCSVLine(line){
  var out = [], cur = '', q = false, c;
  for (var i = 0; i < line.length; i++){
    c = line[i];
    if (q){
      if (c === '"'){ if (line[i+1] === '"'){ cur += '"'; i++; } else q = false; }
      else cur += c;
    } else {
      if (c === '"') q = true;
      else if (c === ','){ out.push(cur); cur = ''; }
      else cur += c;
    }
  }
  out.push(cur);
  return out;
}

function pot(cc, sc){
  cc = (cc || 0) + CONST_FIX;
  if (sc >= 10000000) return cc + 2.0;
  if (sc >= 9800000) return cc + 1.0 + (sc - 9800000) / 200000.0;
  return Math.max(0, cc - (9800000 - sc) / 300000.0);
}

function cmOf(t){
  var s = String(t || '');
  if (/pure memory|^pm$/i.test(s)) return {k:'pm', t:'PURE MEMORY'};
  if (/full recall|^fc$/i.test(s)) return {k:'fc', t:'FULL RECALL'};
  if (/easy clear|^ec$/i.test(s))  return {k:'ec', t:'EASY CLEAR'};
  if (/hard clear|^hc$/i.test(s))  return {k:'hc', t:'HARD CLEAR'};
  if (/track lost|^tl$/i.test(s))  return {k:'tl', t:'TRACK LOST'};
  if (/track complete|^tc$|clear/i.test(s)) return {k:'tc', t:'TRACK COMPLETE'};
  return {k:'tc', t: s || '—'};
}

/* ---------- 解析 ---------- */
function parseCSV(text){
  var lines = String(text || '').replace(/\r/g, '').split('\n').filter(function(l){ return l.trim(); });
  if (!lines.length) return [];
  var head = splitCSVLine(lines[0].replace(/^\uFEFF/, ''));
  var ix = {};
  for (var h = 0; h < head.length; h++) ix[head[h].trim()] = h;
  var out = [];
  for (var i = 1; i < lines.length; i++){
    var c = splitCSVLine(lines[i]);
    if (c.length < 6) continue;
    var sc = parseInt(c[ix.score], 10) || 0;
    var cc = parseFloat(c[ix.const]) || 0;
    out.push({
      id: c[ix.id] || '', song: c[ix.song] || '', diff: c[ix.diff] || '',
      cc: cc, score: sc,
      shiny: parseInt(c[ix.shiny], 10) || 0,
      pure: parseInt(c[ix.pure], 10) || 0,
      far: parseInt(c[ix.far], 10) || 0,
      lost: parseInt(c[ix.lost], 10) || 0,
      clear: c[ix.clear] || '',
      date: c[ix.date] || '',
      ts: (ix.ts != null ? (parseInt(c[ix.ts], 10) || 0) : 0),
      pot: pot(cc, sc)
    });
  }
  return out;
}

/* ---------- 渲染 ---------- */
function keyOf(r){ return r.id + '|' + r.diff; }

function deltaOf(r){
  var k = keyOf(r), p = PREV[k];
  if (p == null) return null;
  return r.score - p;
}

function cardHTML(r, i){
  var cm = cmOf(r.clear);
  var title = r.song || (SONG[r.id] && SONG[r.id].title) || r.id;
  var src = recentJacketSrc(r.id);
  var d = deltaOf(r);
  var dg;
  if (d === null) dg = '<span class="dg new">NEW</span>';
  else if (d > 0) dg = '<span class="dg up">▲ +' + d.toLocaleString() + '</span>';
  else if (d < 0) dg = '<span class="dg dn">▼ ' + d.toLocaleString() + '</span>';
  else dg = '<span class="dg new">— 持平</span>';

  return '<div class="rc">'
    + '<img class="cov" src="' + esc(src) + '" alt="">'
    + '<div class="body">'
    +   '<div class="r1"><span class="ttl">' + esc(title) + '</span><span class="no">#' + (i + 1) + '</span></div>'
    +   '<div class="r2"><span class="cc">[' + (r.cc + CONST_FIX).toFixed(1) + ']</span>'
    +     '<span class="dif">' + esc(r.diff) + '</span></div>'
    +   '<div class="r3"><span class="sc">' + r.score.toLocaleString() + '</span>'
    +     '<span class="cm ' + cm.k + '">' + esc(cm.t) + '</span>'
    +     '<span class="pot">' + r.pot.toFixed(3) + '</span></div>'
    +   '<div class="r4">PURE ' + r.pure + ' <span style="opacity:.6">(+' + r.shiny + ')</span>'
    +     ' · FAR ' + r.far + (r.lost > 0 ? ' · <span class="fl">LOST ' + r.lost + '</span>' : ' · LOST 0') + '</div>'
    +   '<div class="r5">' + dg + '<span style="color:#b9b0cc;font-size:11px">' + esc(r.date) + '</span></div>'
    + '</div></div>';
}

function render(){
  var listEl = $('#list'), noteEl = $('#note');
  if (!ROWS.length){ noteEl.textContent = '请先进行成绩查询喵 —— 回到「成绩查询」页查一次，或者把 scores.csv 粘进上面的框。'; listEl.innerHTML = ''; return; }
  var sorted = ROWS.slice().sort(function(a, b){
    if (a.ts && b.ts) return b.ts - a.ts;
    var d = String(b.date).localeCompare(String(a.date));
    return d !== 0 ? d : (b.pot - a.pot);
  });
  var sel = sorted.slice(0, LIMIT);
  listEl.innerHTML = sel.map(cardHTML).join('');
  noteEl.textContent = sel.length ? ('最新一条 · 共 ' + ROWS.length + ' 条成绩。▲▼ 是相对上次查询的变化。') : '';
  // 绑定封面占位
  Array.prototype.forEach.call(listEl.querySelectorAll('img.cov'), function(im){
    im.addEventListener('error', function(){
      var d = document.createElement('div');
      d.className = 'cov ph'; d.textContent = '♪';
      if (im.parentNode) im.parentNode.replaceChild(d, im);
    });
  });
  // 记录本次快照，供下次对比
  var snap = {};
  ROWS.forEach(function(r){ snap[keyOf(r)] = r.score; });
  localStorage.setItem('arcaea_prev', JSON.stringify(snap));
}

/* ---------- 导出图片（4:3 海报） ---------- */
function rrPath(c, x, y, w, h, r){
  c.beginPath();
  c.moveTo(x + r, y);
  c.lineTo(x + w - r, y); c.quadraticCurveTo(x + w, y, x + w, y + r);
  c.lineTo(x + w, y + h - r); c.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  c.lineTo(x + r, y + h); c.quadraticCurveTo(x, y + h, x, y + h - r);
  c.lineTo(x, y + r); c.quadraticCurveTo(x, y, x + r, y);
  c.closePath();
}
function clipText(c, t, x, y, maxW){
  var s = String(t == null ? '' : t);
  if (c.measureText(s).width <= maxW){ c.fillText(s, x, y); return; }
  var lo = 0, hi = s.length;
  while (lo < hi){
    var mid = (lo + hi + 1) >> 1;
    if (c.measureText(s.slice(0, mid) + '…').width <= maxW) lo = mid; else hi = mid - 1;
  }
  c.fillText(s.slice(0, lo) + '…', x, y);
}
var JK_TIMEOUT_MS = 6000;
/* 曲绘地址统一走这里：离线（exe 内嵌页）用 /jackets/，网页用 jackets/ */
function recentJacketSrc(id){
  if (!id) return '';
  if (typeof jacketSrc === 'function'){
    try { var v = jacketSrc(id); if (v) return v; } catch (e) {}
  }
  var pre = (typeof JK_PREFIX !== 'undefined' && JK_PREFIX) ? JK_PREFIX : 'jackets/';
  return pre + id + '.webp';
}

function loadImg(src){
  return new Promise(function(res){
    var done = false;
    function fin(v){ if (!done){ done = true; res(v); } }
    var im = new Image();
    im.onload = function(){ fin(im); };
    im.onerror = function(){ fin(null); };
    setTimeout(function(){ fin(null); }, JK_TIMEOUT_MS);   /* 图片卡住也要放行 */
    im.src = src;
  });
}
var CM_COLOR = {
  pm: ['#efe4fb', '#7c3aed'], fc: ['#e2f6fa', '#0e90ad'],
  tc: ['#e8edfb', '#4557b8'], ec: ['#fdf3dd', '#a97a12'],
  hc: ['#fde8f1', '#b02f74'], tl: ['#f8e6e8', '#c0414b']
};

// 连续导出时序号依次 +1：_1、_2、_3……；关掉页面就重新从 1 数
// （浏览器不允许网页读下载目录，所以只能按「本页导出了几次」编号）
var SEQ_KEY = 'arcaea_recent_seq';
function nextSeq(){
  var n = 0;
  try { n = parseInt(sessionStorage.getItem(SEQ_KEY) || '0', 10) || 0; } catch (e) { n = 0; }
  n += 1;
  try { sessionStorage.setItem(SEQ_KEY, String(n)); } catch (e) {}
  return n;
}
function resetSeq(){
  try { sessionStorage.removeItem(SEQ_KEY); } catch (e) {}
}
window.addEventListener('pagehide', resetSeq);

function exportImage(){
  var sorted = ROWS.slice().sort(function(a, b){
    if (a.ts && b.ts) return b.ts - a.ts;
    var d = String(b.date).localeCompare(String(a.date));
    return d !== 0 ? d : (b.pot - a.pot);
  }).slice(0, 1);
  if (!sorted.length){ $('#note').textContent = '\u6ca1\u6709\u6570\u636e\u53ef\u4ee5\u5bfc\u51fa\u55b5\u3002'; return; }
  var btn = $('#exp'); var old = btn.textContent;
  btn.disabled = true; btn.textContent = '\u751f\u6210\u4e2d\u2026';

  var W = 1080, H = 702, PAD = 32;   // 高度按内容实际底边收紧（原来 810 底部空了 150px）
  var cv = document.createElement('canvas');
  cv.width = W; cv.height = H;
  var c = cv.getContext('2d');
  var r = sorted[0];

  function poly(pts){
    c.beginPath();
    c.moveTo(pts[0][0], pts[0][1]);
    for (var i = 1; i < pts.length; i++) c.lineTo(pts[i][0], pts[i][1]);
    c.closePath();
  }
  function slantRect(x, y, w, h, cut, o){
    o = o || {};
    var p = [];
    if (o.tl) p.push([x + cut, y]); else p.push([x, y]);
    if (o.tr) p.push([x + w - cut, y]); else p.push([x + w, y]);
    if (o.tr) p.push([x + w, y + cut]);
    if (o.br){
      p.push([x + w, y + h - cut]);
      p.push([x + w - cut, y + h]);
    }
    // 左下角：从底边往回走
    if (o.bl) p.push([x + cut, y + h]); else p.push([x, y + h]);
    if (o.bl) p.push([x, y + h - cut]);
    if (o.tl) p.push([x, y + cut]);
    return p;
  }

  loadImg(recentJacketSrc(r.id)).then(function(im){
    var title = r.song || (SONG[r.id] && SONG[r.id].title) || r.id;
    var cm = cmOf(r.clear), col = CM_COLOR[cm.k] || CM_COLOR.tc;
    var uname = LAST_NAME || 'PLAYER';
    var urate = LAST_RATE || '\u2014';

    // ===== 背景：清晰曲绘铺满 + 冷色 veil =====
    c.fillStyle = '#1a1226'; c.fillRect(0, 0, W, H);
    if (im){
      var sc = Math.max(W / im.width, H / im.height);
      var dw = im.width * sc, dh = im.height * sc;
      c.drawImage(im, (W - dw) * 0.72, (H - dh) / 2, dw, dh);
      var veilL = c.createLinearGradient(0, 0, W * 0.72, 0);
      veilL.addColorStop(0, 'rgba(26,18,38,.93)');
      veilL.addColorStop(.55, 'rgba(26,18,38,.72)');
      veilL.addColorStop(1, 'rgba(26,18,38,.18)');
      c.fillStyle = veilL; c.fillRect(0, 0, W, H);
      var veilY = c.createLinearGradient(0, 0, 0, H);
      veilY.addColorStop(0, 'rgba(16,10,26,.55)');
      veilY.addColorStop(.35, 'rgba(16,10,26,.10)');
      veilY.addColorStop(1, 'rgba(16,10,26,.75)');
      c.fillStyle = veilY; c.fillRect(0, 0, W, H);
    }

    // ===== 顶栏 =====
    var TB = 52;
    c.fillStyle = 'rgba(244,244,250,.92)'; c.fillRect(0, 0, W, TB);
    c.fillStyle = 'rgba(180,175,200,.55)'; c.fillRect(0, TB, W, 2);

    c.textBaseline = 'middle'; c.textAlign = 'left';
    c.fillStyle = '#2b2438'; c.font = '600 21px "Exo 2","Segoe UI",sans-serif';
    c.fillText('Recent Play', PAD, TB / 2);

    c.textAlign = 'right';
    c.fillStyle = 'rgba(60,52,78,.72)'; c.font = '500 19px "Exo 2","Segoe UI",sans-serif';
    c.fillText('Generated by Arcaea \u6210\u7ee9\u63d0\u53d6\u5668', W - PAD, TB / 2);

    var avR = 21, avX = W / 2 - 62, avY = TB / 2;
    if (im){
      c.save(); c.beginPath(); c.arc(avX, avY, avR, 0, Math.PI * 2); c.clip();
      c.drawImage(im, avX - avR, avY - avR, avR * 2, avR * 2); c.restore();
      c.save(); c.beginPath(); c.arc(avX, avY, avR, 0, Math.PI * 2);
      c.strokeStyle = 'rgba(255,255,255,.85)'; c.lineWidth = 2.5; c.stroke(); c.restore();
    }
    c.textAlign = 'left';
    c.fillStyle = '#2b2438'; c.font = '600 20px "Exo 2","Segoe UI",sans-serif';
    c.fillText(uname, avX + avR + 12, avY - 8);
    c.fillStyle = 'rgba(120,60,150,.95)'; c.font = '700 15px ui-monospace,Consolas,monospace';
    c.fillText(urate, avX + avR + 12, avY + 12);

    // ===== 歌名区（居中） =====
    var ty = TB + 74;
    c.textAlign = 'center';
    c.fillStyle = '#ffffff';
    c.font = '700 46px "Exo 2","Segoe UI","Microsoft YaHei",sans-serif';
    // 右栏几何（结算等级 / 分数面板用）
    var RX = 400, RW = W - RX - PAD;
    // 歌名 / 难度 —— 整张图的正中央
    var CX = W / 2;
    c.shadowColor = 'rgba(0,0,0,.55)'; c.shadowBlur = 18;
    var tmax = W - PAD * 2;
    c.font = '700 52px "Exo 2","Segoe UI",sans-serif';
    c.textAlign = 'left';
    clipText(c, title, CX - Math.min(tmax, c.measureText(title).width) / 2, ty, tmax);
    c.textAlign = 'center';
    c.shadowBlur = 0;

    // 难度名（FUTURE）本身也居中，两侧短横线按它的实际宽度自动排
    var dstr = String(r.diff || '').toUpperCase();
    c.fillStyle = 'rgba(255,255,255,.72)'; c.font = '600 20px "Exo 2","Segoe UI",sans-serif';
    var dW = c.measureText(dstr).width;
    c.fillText(dstr, CX, ty + 30);
    var gapLine = 18, lineW = 88;
    c.fillStyle = 'rgba(255,255,255,.30)';
    c.fillRect(CX - dW / 2 - gapLine - lineW, ty + 24, lineW, 2);
    c.fillRect(CX + dW / 2 + gapLine, ty + 24, lineW, 2);

    // ===== 左栏 =====
    var LX = PAD + 10, LY = TB + 140;
    var dmX = LX + 26, dmY = LY + 24, dmR = 26;
    poly([[dmX, dmY - dmR], [dmX + dmR, dmY], [dmX, dmY + dmR], [dmX - dmR, dmY]]);
    c.fillStyle = 'rgba(30,22,46,.78)'; c.fill();
    c.strokeStyle = col[1]; c.lineWidth = 2; c.stroke();
    c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillStyle = '#fff';
    c.font = '700 19px ui-monospace,Consolas,monospace';
    c.fillText((r.cc + CONST_FIX).toFixed(1), dmX, dmY + 1);

    c.textAlign = 'left';
    c.fillStyle = '#ffffff'; c.font = '700 22px "Exo 2","Segoe UI",sans-serif';
    c.fillText(dstr, LX + 66, dmY - 12);
    c.fillStyle = 'rgba(255,255,255,.62)'; c.font = '600 14px "Exo 2","Segoe UI",sans-serif';
    c.fillText('TIME PLAYED', LX + 66, dmY + 4);
    c.fillStyle = 'rgba(255,255,255,.88)'; c.font = '600 16px ui-monospace,Consolas,monospace';
    c.fillText(String(r.date || '').slice(0, 16), LX + 66, dmY + 24);

    var JX = LX - 6, JY = LY + 66, JS = 330;
    if (im){
      c.save();
      c.shadowColor = 'rgba(0,0,0,.6)'; c.shadowBlur = 30; c.shadowOffsetY = 8;
      c.fillStyle = '#000'; c.fillRect(JX, JY, JS, JS); c.restore();
      c.save(); c.beginPath(); c.rect(JX, JY, JS, JS); c.clip();
      c.drawImage(im, JX, JY, JS, JS); c.restore();
      c.strokeStyle = 'rgba(255,255,255,.55)'; c.lineWidth = 1.5;
      c.strokeRect(JX + .75, JY + .75, JS - 1.5, JS - 1.5);
      for (var si = 0; si < 14; si++){
        c.fillStyle = si % 2 ? 'rgba(255,255,255,.20)' : 'rgba(255,255,255,.06)';
        c.fillRect(JX + JS + 6 + si * 5, JY, 3, JS);
      }
    }

    // ===== 右栏 =====

    // 结算等级（TRACK COMPLETE 等）居中显示
    c.textAlign = 'center'; c.textBaseline = 'alphabetic';
    c.font = '700 52px "Exo 2","Segoe UI",sans-serif';
    c.fillStyle = col[0];
    c.shadowColor = 'rgba(0,0,0,.5)'; c.shadowBlur = 14;
    c.fillText(cm.t, RX + RW / 2, LY + 62);
    c.shadowBlur = 0;
    c.textAlign = 'left';

    var SY = LY + 86, SH = 86;
    var sp = slantRect(RX, SY, RW, SH, 26, { tl: true, br: true });
    c.fillStyle = 'rgba(238,232,248,.20)'; poly(sp); c.fill();
    c.strokeStyle = 'rgba(255,255,255,.28)'; c.lineWidth = 1.5; poly(sp); c.stroke();

    var sFmt = String(r.score).replace(/\B(?=(\d{3})+(?!\d))/g, "'");
    c.textAlign = 'center'; c.textBaseline = 'middle';
    c.fillStyle = '#ffffff'; c.font = '700 56px ui-monospace,Consolas,monospace';
    c.shadowColor = 'rgba(0,0,0,.5)'; c.shadowBlur = 12;
    c.fillText(sFmt, RX + RW / 2, SY + SH / 2 + 3);
    c.shadowBlur = 0;

    var PY = SY + SH + 12, PH = 40;
    var pp = slantRect(RX, PY, RW, PH, 20, { tl: true });
    c.fillStyle = 'rgba(40,30,60,.55)'; poly(pp); c.fill();
    var pv = c.createLinearGradient(RX, 0, RX + 150, 0);
    pv.addColorStop(0, 'rgba(139,92,246,.90)'); pv.addColorStop(1, 'rgba(139,92,246,.10)');
    c.fillStyle = pv; c.fillRect(RX, PY, 150, PH);

    // POTENTIAL 条：定数与潜力居中排布（用户要求）
    var ccv = (r.cc + CONST_FIX).toFixed(1);
    var potTxt = r.pot.toFixed(3);
    var fCc = '600 19px ui-monospace,Consolas,monospace';
    var fAr = '600 15px "Exo 2",sans-serif';
    var fPot = '700 22px ui-monospace,Consolas,monospace';
    var padA = 12, padB = 14;
    c.font = fCc;  var wCc = c.measureText(ccv).width;
    c.font = fAr;  var wAr = c.measureText('▸').width;
    c.font = fPot; var wPot = c.measureText(potTxt).width;
    var gTot = wCc + padA + wAr + padB + wPot;
    var gx = RX + (RW - gTot) / 2;                 // 这组整体居中
    var gmid = PY + PH / 2;

    c.textAlign = 'left'; c.textBaseline = 'middle';
    c.fillStyle = 'rgba(255,255,255,.62)'; c.font = fCc;
    c.fillText(ccv, gx, gmid);
    c.fillStyle = 'rgba(255,255,255,.42)'; c.font = fAr;
    c.fillText('▸', gx + wCc + padA, gmid);
    c.fillStyle = '#ffffff'; c.font = fPot;
    c.fillText(potTxt, gx + wCc + padA + wAr + padB, gmid);

    // 变化量：接在这组右侧
    var d = deltaOf(r);
    c.textAlign = 'left';
    var dvx = gx + gTot + 16;
    if (d === null){ c.fillStyle = 'rgba(255,255,255,.45)'; c.font = '700 14px "Exo 2",sans-serif'; c.fillText('NEW', dvx, gmid); }
    else if (d > 0){ c.fillStyle = '#6ee7a8'; c.font = '700 14px "Exo 2",sans-serif'; c.fillText('▲ +' + d.toLocaleString(), dvx, gmid); }
    else if (d < 0){ c.fillStyle = '#f472b6'; c.font = '700 14px "Exo 2",sans-serif'; c.fillText('▼ ' + d.toLocaleString(), dvx, gmid); }
    else { c.fillStyle = 'rgba(255,255,255,.45)'; c.font = '700 14px "Exo 2",sans-serif'; c.fillText('—', dvx, gmid); }
    c.textAlign = 'left';

    // EX + 判定：放在分数/POTENTIAL 之下，整体水平居中（用户要求）
    var CBX = RX + RW / 2;                       // 居中基准线
    var EXY = PY + PH + 26, EXH = 76, EXW = 210;
    var exL = CBX - EXW / 2;
    poly([[exL + 20, EXY], [exL + EXW, EXY], [exL + EXW - 20, EXY + EXH], [exL, EXY + EXH]]);
    c.fillStyle = 'rgba(255,255,255,.90)'; c.fill();
    c.strokeStyle = 'rgba(120,110,150,.35)'; c.lineWidth = 1.5; c.stroke();
    c.textAlign = 'center'; c.textBaseline = 'middle';
    c.fillStyle = '#5b4f7a'; c.font = '700 46px "Exo 2","Segoe UI",sans-serif';
    // 没有判定数据（老 CSV / 缺列）时不要瞎猜等级，显示 —
    var hasJudge = (typeof r.pure === 'number') && (typeof r.far === 'number') && (typeof r.lost === 'number')
                   && (r.pure + r.far + r.lost > 0);
    var tot = hasJudge ? (r.pure + r.far + r.lost) : 0;
    var scoreOnly = (r.score >= 9900000) ? 'PM' : (r.score >= 9500000 ? 'EX'
                  : (r.score >= 9000000 ? 'AA' : 'A'));
    var grade = !hasJudge ? '—'
              : (r.lost === 0 ? (r.pure === tot ? 'PM' : 'EX') : scoreOnly);
    c.fillText(grade, CBX, EXY + EXH / 2 + 2);

    var JY2 = EXY + EXH + 18, PH2 = 30, PW = 210, PGAP = 8;
    var jv = function(v){ return hasJudge ? String(v) : '—'; };
    var jd = [
      ['PURE', jv(r.pure), 'rgba(168,85,247,.95)', 'rgba(110,40,180,.95)'],
      ['FAR', jv(r.far), 'rgba(234,160,60,.95)', 'rgba(170,100,10,.95)'],
      ['LOST', jv(r.lost), 'rgba(230,90,150,.95)', 'rgba(160,30,90,.95)']
    ];
    for (var ji = 0; ji < 3; ji++){
      var jyy = JY2 + ji * (PH2 + PGAP);
      var pl = CBX - PW / 2;                     // 药丸也居中
      poly([[pl + 16, jyy], [pl + PW, jyy], [pl + PW - 16, jyy + PH2], [pl, jyy + PH2]]);
      c.fillStyle = 'rgba(244,240,252,.86)'; c.fill();
      c.fillStyle = jd[ji][2]; c.fillRect(pl + 2, jyy + 8, 4, PH2 - 16);
      c.textAlign = 'left'; c.textBaseline = 'middle';
      c.fillStyle = jd[ji][3]; c.font = '700 13px "Exo 2","Segoe UI",sans-serif';
      c.fillText(jd[ji][0], pl + 18, jyy + PH2 / 2);
      c.textAlign = 'right';
      c.fillStyle = '#2b2438'; c.font = '700 19px ui-monospace,Consolas,monospace';
      c.fillText(jd[ji][1], pl + PW - 24, jyy + PH2 / 2);
    }

    // ===== footer =====
    c.textAlign = 'left'; c.textBaseline = 'alphabetic';
    c.fillStyle = 'rgba(255,255,255,.34)';
    c.font = '12px "Exo 2","Segoe UI",sans-serif';
    c.fillText('\u5b9a\u6570 +0.4 \u4fee\u6b63 \u00b7 \u66f2\u7ed8\u7248\u6743\u5f52 lowiro \u6240\u6709', PAD, H - 18);

    // 文件名：歌名-年月日_序号。日语/中文歌名必须保留，所以只清掉 Windows 文件名禁用字符
    var d = new Date();
    var ymd = '' + d.getFullYear() + ('0' + (d.getMonth() + 1)).slice(-2) + ('0' + d.getDate()).slice(-2);
    var songName = (r.song || r.title || 'recent').toString().replace(/[\/:*?"<>|]/g, '_').replace(/\s+$/, '');
    cv.toBlob(function(b){
      var a = document.createElement('a');
      a.href = URL.createObjectURL(b);
      a.download = songName + '-' + ymd + '_' + nextSeq() + '.png';
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(function(){ URL.revokeObjectURL(a.href); }, 4000);
      btn.disabled = false; btn.textContent = old;
    }, 'image/png');
  });
}



/* ---------- 玩家信息 ---------- */
var API_BASE = '__API_BASE__';
function apiBase(){
  if (window.__OFFLINE__) return '';
  if (API_BASE && API_BASE !== '__API_BASE__') return API_BASE.replace(/\/+$/, '');
  return '';
}
function loadPlayer(){
  var tok = (window.__AUTOTOKEN__ || new URLSearchParams(location.search).get('t') || localStorage.getItem('arcaea_token') || '').trim();
  if (!tok) return;
  fetch(apiBase() + '/api/user/me', { headers: { 'X-Token': tok } })
    .then(function(r){ return r.json(); })
    .then(function(j){
      var v = j && (j.value || j);
      if (!v || !v.name) return;
      LAST_NAME = v.name;
      LAST_RATE = (v.rating / 1000).toFixed(3);
      var el = document.getElementById('who');
      if (el){ el.textContent = LAST_NAME + ' · ' + LAST_RATE; el.classList.remove('hide'); }
      if (ROWS.length) render();
    })
    .catch(function(){});
}

/* ---------- 数据装载 ---------- */
function loadSongmap(){
  return fetch('songmap.json').then(function(r){ return r.ok ? r.json() : {}; }).catch(function(){ return {}; });
}

function boot(){
  if (document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', boot, { once: true });
    return;
  }
  if (!$('#parse') || !$('#exp')) return;
  var qs = new URLSearchParams(location.search);
  var qc = qs.get('c');
  $('#parse').addEventListener('click', function(){
    ROWS = parseCSV($('#csv').value);
    render();
  });
  $('#exp').addEventListener('click', function(){ exportImage(); });

  loadSongmap().then(function(sm){
    SONG = sm || {};
    var t = '';
    if (qc){
      try { t = decodeURIComponent(escape(atob(qc))); } catch(e){ t = ''; }
    }
    if (!t) t = localStorage.getItem('arcaea_csv') || '';
    if (t){
      $('#csv').value = t;
      ROWS = parseCSV(t);
    }
    render();
    loadPlayer();
  });
}
boot();
