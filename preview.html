<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>导出预览 · Arcaea 国服查分</title>
<style>
  :root{--pink:#d3459a;--purple:#8b5cf6}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#0d0b14;color:#e7e2f5;font-family:"Exo 2","Segoe UI","Microsoft YaHei",system-ui,sans-serif;min-height:100vh}
  .bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:14px 20px;border-bottom:1px solid rgba(255,255,255,.07);position:sticky;top:0;background:rgba(13,11,20,.92);backdrop-filter:blur(8px);z-index:5}
  .bar .ttl{font-weight:700;font-size:15px;letter-spacing:.04em;margin-right:6px}
  .bar .ttl small{font-weight:500;color:rgba(255,255,255,.35);margin-left:8px;font-size:12px}
  .sw{display:flex;gap:6px;background:rgba(255,255,255,.05);padding:4px;border-radius:10px}
  .sw button{background:none;border:0;color:rgba(255,255,255,.62);padding:7px 16px;border-radius:7px;font-size:13px;cursor:pointer;font-family:inherit;transition:.15s}
  .sw button:hover{color:#fff}
  .sw button.on{background:linear-gradient(135deg,var(--purple),var(--pink));color:#fff;font-weight:600}
  .bar .sp{flex:1}
  .bar .res{font-size:12px;color:rgba(255,255,255,.32)}
  .bar2{border-bottom:1px solid rgba(255,255,255,.07);padding-top:10px;padding-bottom:10px}
  .bar2 .dlbl{font-size:12.5px;color:rgba(255,255,255,.42);margin-right:2px}
  .bar2 .hint{font-size:12px;color:rgba(255,255,255,.30);margin-left:6px}
  .bar .meta{font-size:12px;color:rgba(255,255,255,.38);font-variant-numeric:tabular-nums}
  .bar .dl{background:linear-gradient(135deg,var(--purple),var(--pink));border:0;color:#fff;font-weight:600;padding:9px 20px;border-radius:9px;font-size:13.5px;cursor:pointer;font-family:inherit}
  .bar .dl:disabled{opacity:.5;cursor:default}
  .bar .sec{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);color:#dcd6ee;padding:9px 16px;border-radius:9px;font-size:13px;cursor:pointer;font-family:inherit}
  .stage{padding:20px;display:flex;justify-content:center;align-items:flex-start}
  #cv{max-width:min(100%,1400px);max-height:calc(100vh - 175px);width:auto;height:auto;
      border-radius:12px;box-shadow:0 18px 60px rgba(0,0,0,.55);display:none;
      object-fit:contain;cursor:zoom-in}
  #cv.fit{max-height:none;cursor:zoom-out}
  .zoomtip{position:fixed;right:16px;bottom:14px;font-size:12px;color:rgba(255,255,255,.3)}
  .empty{color:rgba(255,255,255,.4);font-size:14px;line-height:2;text-align:center;padding:80px 20px}
  .empty a{color:#c4b5fd}
  .tip{text-align:center;font-size:12px;color:rgba(255,255,255,.28);padding:0 20px 18px}
  .busy{color:#c4b5fd;font-size:14px;padding:90px 0;text-align:center}
</style>
</head>
<body>
<div class="bar">
  <div class="ttl">导出预览<small>先看效果，满意再下载</small></div>
  <div class="sw" id="sw"></div>
  <div class="sp"></div>
  <span class="res" id="res">竖版长图</span>
  <div class="meta" id="meta"></div>
</div>
<div class="bar bar2">
  <span class="hint" id="hint"></span>
  <div class="sp"></div>
  <button class="sec" id="back">回查分页</button>
  <button class="dl" id="dl" disabled>下载 PNG</button>
</div>
<div class="stage"><div class="empty" id="empty">正在生成…</div><canvas id="cv"></canvas></div>
<div class="tip">点图片可放大 / 再点缩小 · 曲绘版权归 lowiro 所有 · 定数已按 +0.4 修正 · 图片完全在你的浏览器里生成，不上传任何数据</div>

<script src="export-engine.js"></script>
<script>
/* 预览页只干三件事：拿到数据 → 生成 → 下载。
   模板引擎、B30/R10 计算全部复用查分页同一份 export-engine.js。 */
(function(){
  var TPL_LIST = ARC_TPL.list, TPL_DESC = ARC_TPL.desc;
  var state = { tpl: 'portrait', lv: 1, theme: 'light', data: null, site: '', cv: null, url: '', busy: false, seq: 0 };
  function $(s){ return document.querySelector(s); }
  function qs(k, src){ var m = new RegExp('[?&]' + k + '=([^&]*)').exec(src || location.search); return m ? decodeURIComponent(m[1]) : ''; }
  function settingsSet(k, v){ try { localStorage.setItem(k, v); } catch(e){} }
  function settingsGet(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }

  function paintSwitch(){
    var sw = $('#sw'); sw.innerHTML = '';
    TPL_LIST.forEach(function(t){
      var b = document.createElement('button');
      b.textContent = t.name;
      if (t.id === state.tpl) b.className = 'on';
      b.title = TPL_DESC[t.id] || '';
      b.onclick = function(){ if (t.id !== state.tpl){ state.tpl = t.id; $('#res').textContent = t.name; paintSwitch(); render(); } };
      sw.appendChild(b);
    });
    $('#hint').textContent = '先看效果，满意就下载 PNG';
  }

  /* 数据来源优先级：window 注入（同源新窗口） > localStorage 缓存 */
  function readPayload(){
    if (window.ARC_PREVIEW && window.ARC_PREVIEW.rows && window.ARC_PREVIEW.rows.length) return window.ARC_PREVIEW;
    var raw = settingsGet('arcaea_preview_' + ARC_TPL.ver);
    if (raw){ try { return JSON.parse(raw); } catch(e){} }
    return null;
  }

  /* 预览窗和查分页是两个窗口，跨窗口拿不到 JACKETS 缓存，
     所以在预览页按 siteUrl 推导曲绘绝对路径重新预载一遍（Image 走 HTTP 缓存，很快）。 */
  /* 曲绘目录：exe / 本地服务下是站根 /jackets/，静态托管时才和页面同目录。
     不按 site 猜目录 —— site 带 /site 或文件名时猜出来的是错的。 */
  function jacketDir(){
    try {
      var u = (state.data && (state.data.site || state.data.base)) || '';
      if (!u) return 'jackets/';
      var loc = location.href.replace(/[?#].*$/, '');
      if (loc.charAt(0) === 'h'){
        // http(s)：优先站根
        return '/jackets/';
      }
      return u.replace(/[?#].*$/, '').replace(/[^/]*$/, '') + 'jackets/';
    } catch (e) { return 'jackets/'; }
  }

  /* 先把候选路径交给引擎试一遍（引擎有 jacketSrc / JACKET_EXTS 逻辑），
     引擎给不出的再按本地规则兜底 */
  var JEXT = ['.webp', '.jpg', '.png'], JCACHE = {};
  function candidateList(id){
    var out = [];
    function push(v){ if (v && out.indexOf(v) < 0) out.push(v); }
    if (typeof ARC_TPL !== 'undefined' && ARC_TPL.jacketSrc){
      try { ARC_TPL.jacketSrc(id).forEach(push); } catch(e){}
    }
    var dir = jacketDir();
    JEXT.forEach(function(e){ push(dir + id + e); push(id && !/^([a-z]+:)?\//i.test(dir) ? ('/jackets/' + id + e) : null); });
    return out;
  }
  /* 曲绘扩展名不定：仓库里是 .webp，老包可能是 .jpg。
     逐个试，命中即缓存；全失败就画 ♫ 占位，别让一次 404 把渲染拖到超时。 */
  function loadOne(id, dir){
    var urls = candidateList(id), i = 0;
    return new Promise(function(res){
      if (!id) return res(null);
      function next(){
        if (i >= urls.length) return res(null);
        var src = urls[i++];
        var im = new Image(), done = false;
        function fin(v){ if (!done){ done = true; res(v); } }
        im.onload = function(){ if (im.naturalWidth){ JCACHE[id] = im; fin(im); } else next(); };
        im.onerror = function(){ next(); };
        setTimeout(function(){ if (!done) next(); }, 5000);
        im.src = src;
      }
      next();
    });
  }
  function hydrateJackets(){
    var dir = jacketDir(), seen = {}, jobs = [];
    (state.data.rows || []).forEach(function(r){
      if (!r || !r.id || seen[r.id]) return;
      seen[r.id] = 1;
      if (JCACHE[r.id]) return;
      jobs.push(loadOne(r.id, dir));
    });
    return Promise.all(jobs);
  }

  async function render(){
    if (!state.data) return;
    var seq = ++state.seq;
    $('#dl').disabled = true;
    $('#cv').style.display = 'none';
    var emp = $('#empty');
    emp.style.display = 'block';
    emp.textContent = '正在生成「' + (TPL_DESC[state.tpl] || state.tpl) + '」…';
    try {
      await hydrateJackets();
      var d = state.data;
      var opt = { rows: d.rows, me: d.me, sm: d.sm, tpl: state.tpl, theme: state.theme };
      var cv = await ARC_TPL.build(opt);
      if (seq !== state.seq) return;
      state.cv = cv;
      var box = $('#cv');
      box.width = state.cv.width; box.height = state.cv.height;
      box.getContext('2d').drawImage(state.cv, 0, 0);
      box.style.display = 'block';
      box.classList.remove('fit');
      emp.style.display = 'none';
      $('#res').textContent = TPL_DESC[state.tpl] || state.tpl;
      $('#meta').textContent = state.cv.width + ' × ' + state.cv.height + ' px';
      $('#dl').disabled = false;
      try { history.replaceState(null, '', '?tpl=' + state.tpl + '&theme=' + state.theme); } catch(e){}
      document.title = '导出预览 ' + state.cv.width + '×' + state.cv.height + ' · Arcaea';
    } catch (e) {
      emp.textContent = '生成失败：' + (e && e.message ? e.message : e);
    }
  }
  /* 点画布 → 放大到 1:1（超过视口就滚动看），再点回「适应窗口」 */
  document.getElementById('cv').addEventListener('click', function(){
    this.classList.toggle('fit');
  });
  window.ARC_PREVIEW_RENDER = render;

  window.setup = function(p){
    if (!p || !p.rows || !p.rows.length) return;
    state.data = p;
    state.site = p.site || p.siteUrl || '';
    if (p.tpl && TPL_DESC[p.tpl]) state.tpl = p.tpl;
    var q = qs('tpl');
    if (q && TPL_DESC[q]) state.tpl = q;
    /* 主题：URL 参数 > localStorage（引擎存的那份） > 默认亮色 */
    var th = qs('theme') || p.theme;
    if (th !== 'dark' && th !== 'light'){
      try { th = (window.ARC_TPL && ARC_TPL.themeGet) ? ARC_TPL.themeGet() : (localStorage.getItem('arcaea_theme') || 'light'); } catch(e){ th = 'light'; }
    }
    state.theme = (th === 'dark') ? 'dark' : 'light';
    /* 数据来源校验结果：查分页导出时随 payload 带过来 */
    window.__ARC_VERIFY__ = p.verify || window.__ARC_VERIFY__ || null;
    paintSwitch();
    render();
  };

  // 同一个页面里连续导出时，后缀依次 +1：_1、_2、_3……（每种模板各数各的）
  // 浏览器不给页面读「下载」目录的权限，所以只能按「本次会话导出了几次」编号。
  function nextSeq(tpl){
    var key = 'arcaea_export_seq_' + tpl, n = 0;
    try { n = parseInt(sessionStorage.getItem(key) || '0', 10) || 0; } catch (e) { n = 0; }
    n += 1;
    try { sessionStorage.setItem(key, String(n)); } catch (e) {}
    return n;
  }

  function download(){
    if (!state.cv) return;
    var me = state.data.me;
    var name = 'arcaea-' + ((me && (me.name || me.display_name)) || 'score') + '-' + state.tpl + '_' + nextSeq(state.tpl) + '.png';
    var cv = state.cv;
    var go = function(url, obj){
      var a = document.createElement('a');
      a.href = url;
      a.download = name;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      if (obj) setTimeout(function(){ URL.revokeObjectURL(obj); }, 6000);
    };
    if (cv.toBlob){
      cv.toBlob(function(b){
        if (b) go(URL.createObjectURL(b), b);
        else go(cv.toDataURL('image/png'), null);
      }, 'image/png');
    } else {
      go(cv.toDataURL('image/png'), null);
    }
  }

  // 预览页关掉/被切走，就认为这一轮导出结束，下次重新从 1 数
  function resetSeq(){
    try {
      ['portrait', 'wide', 'wall'].forEach(function(k){ sessionStorage.removeItem('arcaea_export_seq_' + k); });
    } catch (e) {}
  }
  window.addEventListener('pagehide', resetSeq);
  window.addEventListener('beforeunload', resetSeq);

  document.addEventListener('DOMContentLoaded', function(){
    resetSeq();
    $('#dl').onclick = download;
    $('#back').onclick = function(){
      if (window.opener && !window.opener.closed){ window.opener.focus(); window.close(); }
      else if (state.site) location.href = state.site;
      else history.back();
    };
    var t = qs('tpl');
    if (t && TPL_DESC[t]) state.tpl = t;
    var p = readPayload();
    if (!p || !p.rows || !p.rows.length){
      paintSwitch();
      $('#empty').innerHTML = '没有拿到成绩数据喵。<br>请从 <a href="index.html">查分页</a> 点「导出图片」打开这里。';
      return;
    }
    setup(p);
  });
})();
</script>
<script>
/* 本地版（exe 里的服务）：/index.html 是提取器页，查分页在 /site。
   线上 GitHub Pages 没有这个判断，链接照原样走。 */
(function(){
  if (window.__OFFLINE__ || location.port === '8770' || location.port === '8780') {
    var as = document.querySelectorAll('a[href="index.html"]');
    for (var i = 0; i < as.length; i++) { as[i].setAttribute('href', '/site'); }
  }
})();
</script>
</body>
</html>
