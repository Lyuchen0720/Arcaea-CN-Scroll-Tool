<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Arcaea 查分</title>
<style>
  :root{
    --bg:#0d0818; --panel:rgba(30,20,55,.72); --line:rgba(150,120,255,.22);
    --pink:#ff6bcb; --cyan:#5ce1e6; --purple:#a855f7; --txt:#e8e2ff; --dim:#9a90c0;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    min-height:100vh;font:14px/1.6 "Segoe UI","Microsoft YaHei",system-ui,sans-serif;
    color:var(--txt);
    background:
      radial-gradient(900px 500px at 15% -10%, rgba(168,85,247,.30), transparent 60%),
      radial-gradient(700px 480px at 90% 0%, rgba(92,225,230,.18), transparent 60%),
      radial-gradient(800px 600px at 50% 110%, rgba(255,107,203,.16), transparent 60%),
      var(--bg);
    padding:26px 16px 56px;
  }
  .wrap{max-width:820px;margin:0 auto}
  h1{font-size:20px;letter-spacing:.10em;font-weight:600;
     background:linear-gradient(90deg,var(--cyan),var(--pink));
     -webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:3px}
  .sub{color:var(--dim);font-size:12px;margin-bottom:16px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;
        padding:16px 18px;backdrop-filter:blur(12px);margin-bottom:13px}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  input[type=text],textarea{flex:1;min-width:220px;background:rgba(10,6,22,.6);
        border:1px solid var(--line);border-radius:10px;padding:10px 12px;color:var(--txt);
        font-size:13px;outline:none;font-family:ui-monospace,Consolas,monospace;width:100%}
  textarea{min-height:90px;resize:vertical;line-height:1.5}
  input[type=text]:focus,textarea:focus{border-color:var(--purple);box-shadow:0 0 0 3px rgba(168,85,247,.15)}
  button{background:linear-gradient(135deg,var(--purple),var(--pink));border:0;border-radius:10px;
        padding:10px 20px;color:#fff;font-weight:600;font-size:13px;cursor:pointer}
  button:hover{filter:brightness(1.12)}
  button:disabled{opacity:.5;cursor:default}
  button.ghost{background:transparent;border:1px solid var(--line);color:var(--dim);font-weight:500}
  .hero{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
  .avatar{width:76px;height:76px;border-radius:50%;flex:none;
          background:linear-gradient(135deg,rgba(92,225,230,.35),rgba(255,107,203,.35));
          border:1px solid var(--line);display:grid;place-items:center;font-size:30px}
  .who{flex:1;min-width:160px}
  .name{font-size:23px;font-weight:700;letter-spacing:.02em}
  .code{color:var(--dim);font-size:12px;font-family:ui-monospace,monospace}
  .rating{text-align:right;flex:none}
  .rating .num{font-size:40px;font-weight:800;line-height:1;
      background:linear-gradient(135deg,var(--cyan),var(--purple),var(--pink));
      -webkit-background-clip:text;background-clip:text;color:transparent}
  .rating .lbl{font-size:10px;color:var(--dim);letter-spacing:.24em;margin-top:3px}
  h2{font-size:12px;letter-spacing:.16em;color:var(--dim);margin:0 0 10px;font-weight:600;
     display:flex;justify-content:space-between;align-items:baseline}
  h2 .avg{font-size:13px;color:var(--pink);letter-spacing:.04em;font-weight:700}
  .song{display:flex;align-items:center;gap:10px;padding:7px 0;
        border-bottom:1px solid rgba(150,120,255,.09)}
  .song:last-child{border-bottom:0}
  .jk{opacity:0;transition:opacity .18s}
.jk.jk-on{opacity:1}
.jk,.jk.ph{background:linear-gradient(135deg,rgba(139,92,246,.20),rgba(236,72,153,.14));}.jk{width:34px;height:34px;border-radius:6px;object-fit:cover;flex:none;background:linear-gradient(135deg,rgba(139,92,246,.20),rgba(236,72,153,.14));opacity:0;transition:opacity .18s}
  .jk.jk-on{opacity:1}
  .jk.ph{display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--dim)}
  .rank{width:24px;color:var(--dim);font-family:ui-monospace,monospace;font-size:11px;
        text-align:right;flex:none}
  .rank.top{color:var(--pink);font-weight:700}
  .ttl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}
  .ttl .a{color:var(--dim);font-size:10px;letter-spacing:.06em}
  .cc{width:34px;text-align:center;font-family:ui-monospace,monospace;font-size:12.5px;
      color:var(--cyan);flex:none}
  .sc{width:104px;text-align:right;font-family:ui-monospace,monospace;font-size:12.5px;flex:none}
  .sc small{display:block;color:var(--pink);font-size:10.5px}
  .err{color:#ff8080;font-size:12px;margin-top:8px}
  .hide{display:none}
  .note{color:var(--dim);font-size:11px;margin-top:10px;line-height:1.5}
  .tag{font-size:10px;padding:2px 7px;border-radius:6px;border:1px solid var(--line);
       color:var(--dim);margin-left:6px}
  .tag.ok{color:#6ee7a8;border-color:rgba(110,231,168,.4)}
  .tag.bad{color:#ff8080;border-color:rgba(255,128,128,.4)}
</style>
</head>
<body>
<div class="wrap">
  <h1>ARCAEA · 查分</h1>
  <div class="sub">国服成绩查询 · 本地计算 B30 / R10<span style="font-size:10.5px;opacity:.45;margin-left:8px">v1.6.1</span></div>
  <div class="sub" style="font-size:10.5px;opacity:.55;margin-top:2px">曲绘版权归 lowiro 所有，仅用于曲目识别</div>

  <div class="card">
    <h2>登录凭证</h2>
    <div class="row">
      <input id="tok" type="text" placeholder="粘贴 a_t（可整行 XML）..." spellcheck="false">
      <button id="go">查询</button>
    </div>
    <div id="err" class="err hide"></div>
  </div>

  <div class="card">
    <h2>成绩数据（可选） <span class="tag">算 B30/R10 需要</span></h2>
    <div class="sub" style="margin:0 0 8px">
      粘贴 scores.csv 的内容。没有也能查账号和最近成绩，只是不显示 B30/R10。
    </div>
    <textarea id="csv" placeholder="song,id,diff,const,score,...&#10;Grievous Lady,grievouslady,Future,11,9863372,..." spellcheck="false"></textarea>
    <div class="row" style="margin-top:8px">
      <button id="calc" class="ghost">只用 CSV 计算</button>
      <button id="expImg" class="ghost" style="background:linear-gradient(135deg,#8b5cf6,#ec4899);color:#fff;border-color:transparent">导出图片</button>
      <button id="jkBtn" class="ghost">导入封面 zip</button>
      <button id="jkDirBtn" class="ghost" title="若是 exe 导出的 jackets 目录，可直接选那个文件夹；也可以在本页按 Ctrl+O 打开 index.html">选择曲绘目录</button>
      <input id="jkFile" type="file" accept=".zip" style="display:none">
      <input id="jkDir" type="file" webkitdirectory directory style="display:none">
      <span id="csvState" class="sub" style="margin:0"></span>
    </div>
  </div>

  <div id="profile" class="card hide">
    <div class="hero">
      <div class="avatar">&#10022;</div>
      <div class="who">
        <div class="name" id="pname">—</div>
        <div class="code" id="pcode"></div>
      </div>
      <div class="rating">
        <div class="num" id="prating">—</div>
        <div class="lbl">POTENTIAL</div>
      </div>
    </div>
  </div>

  <div id="recent" class="card hide">
    <h2>最近成绩</h2>
    <div id="recentBody"></div>
  </div>

  <div id="b30" class="card hide">
    <h2>BEST 30 <span class="avg" id="b30avg"></span></h2>
    <div id="b30Body"></div>
  </div>

  <div id="r10" class="card hide">
    <h2>RECENT 10 <span class="avg" id="r10avg"></span></h2>
    <div id="r10Body"></div>
    <div class="note">
      定数取自 songlist（整数），已按 <code>+0.4</code> 修正平均偏差；单曲潜力误差约 ±0.2。
      B30/R10 为本地估算，官方 rating 以服务器为准。
    </div>
  </div>
</div>
<script>
var $ = function(s){ return document.querySelector(s); };
var CONST_FIX = 0.4;

function showErr(m){ var e=$('#err'); e.textContent=m; e.classList.remove('hide'); }
function hideErr(){ $('#err').classList.add('hide'); }
function fmt(n){ return (n/1e6).toFixed(6); }

function cleanToken(v){
  v = (v||'').trim();
  var m = v.match(/name="a_t"\s*>([^<]+)</);
  if (m) return m[1].trim();
  m = v.match(/>([^<]{8,})</);
  if (m) return m[1].trim();
  return v;
}

function pot(cc, sc){
  if (sc >= 10000000) return cc + 2;
  if (sc >= 9800000) return cc + 1 + (sc - 9800000) / 200000;
  return Math.max(0, cc - (9800000 - sc) / 300000);
}

function diffLabel(d){
  var m = {0:'PAST',1:'PRESENT',2:'FUTURE',3:'BEYOND',4:'BEYOND'};
  if (typeof d === 'string') return d.toUpperCase();
  return m[d] || d;
}

var API_BASE = 'https://arcaea-proxy.2292666749.workers.dev';
var OFFLINE = !!window.__OFFLINE__;
var JK_PREFIX = 'jackets/';   // OFFLINE 时切成 /jackets/

function apiBase(){
  // 本地服务：走同源 /api/*，曲绘走 /jackets/<id>.webp（exe 已缓存到本地）
  if (OFFLINE){ JK_PREFIX = '/jackets/'; return ''; }
  if (API_BASE && API_BASE !== '__API_BASE__') return API_BASE.replace(/\/+$/, '');
  return '';
}

function api(path, tok){
  var base = apiBase();
  var url = (base ? base : '') + '/api' + path;
  return fetch(url, { headers: { 'X-Token': tok || '' } })
    .then(function(r){ return r.text().then(function(t){ return { status: r.status, text: t }; }); })
    .then(function(o){
      try { return JSON.parse(o.text); }
      catch(e){ throw new Error('HTTP ' + o.status + ' ' + o.text.slice(0,120)); }
    });
}

function loadSongmap(){
  var bases = ['', apiBase()];
  var i = 0;
  function tryNext(){
    if (i >= bases.length) return Promise.resolve({});
    var b = bases[i++];
    return fetch(b + '/songmap.json')
      .then(function(r){ if (!r.ok) throw new Error('bad'); return r.json(); })
      .catch(function(){ return tryNext(); });
  }
  return tryNext();
}

function splitCSVLine(line){
  var out = [], cur = "", q = false;
  for (var i = 0; i < line.length; i++){
    var ch = line.charAt(i);
    if (q){
      if (ch === '"'){
        if (line.charAt(i + 1) === '"') { cur += '"'; i++; }
        else { q = false; }
      } else { cur += ch; }
    } else {
      if (ch === '"') { q = true; }
      else if (ch === ",") { out.push(cur); cur = ""; }
      else { cur += ch; }
    }
  }
  out.push(cur);
  return out;
}

function parseCSV(text){
  var lines = (text||'').trim().split(/\r?\n/).filter(function(l){ return l.trim(); });
  if (lines.length < 2) return [];
  var head = lines[0].replace(/^\uFEFF/, '').split(',').map(function(s){ return s.trim(); });
  var ix = {};
  head.forEach(function(h, i){ ix[h] = i; });
  return lines.slice(1).map(function(line){
    var c = splitCSVLine(line);
    return {
      song: (c[ix.song] || '').trim(),
      id: (c[ix.id] || '').trim(),
      diff: (c[ix.diff] || '').trim(),
      cc: parseFloat(c[ix.const]) || 0,
      score: parseInt(c[ix.score], 10) || 0,
      shiny: parseInt(c[ix.shiny], 10) || 0,
      pure: parseInt(c[ix.pure], 10) || 0,
      far: parseInt(c[ix.far], 10) || 0,
      lost: parseInt(c[ix.lost], 10) || 0,
      date: (c[ix.date] || '').trim(),
      clear: (c[ix.clear] || '').trim()
    };
  }).filter(function(r){ return r.score > 0; });
}
</script>
<script>
var JACKETS = {};   // id -> dataURL

var LOCAL = {};          // 本地路径映射：模拟器导出的曲绘目录（file:// 或 绝对路径）
function jacketImg(id){
  if (!id) return '<div class="jk ph">&#9835;</div>';
  // 1) 本地目录优先  2) 用户导入的 zip  3) 仓库内置 WebP
  var src = JACKETS[id] || (LOCAL.__base ? LOCAL.__base + '/' + id + '.jpg' : '') || (JK_PREFIX + id + '.webp');
  return '<img class="jk" loading="lazy" src="' + src + '" alt="" data-jk="' + id + '">';
}

/* ---- 曲绘加载：失败重试 + 骨架占位 + 统一兜底（不再一次失败就永久 ♫） ---- */
var JK_TRIES = {}, JK_MAX = 3, JK_DELAY = [400, 1200];

function jkFail(im){
  var id = im.getAttribute('data-jk') || '';
  var n = (JK_TRIES[id] = (JK_TRIES[id] || 0) + 1);
  if (n <= JK_MAX){
    var src = im.getAttribute('src') || '';
    src = src.replace(/[?&]_r=\d+/, '');
    var delay = JK_DELAY[n - 1] || 1500;
    setTimeout(function(){
      if (!im.parentNode) return;
      im.setAttribute('src', src + (src.indexOf('?') >= 0 ? '&' : '?') + '_r=' + n);
    }, delay);
    return;
  }
  var d = document.createElement('div');
  d.className = 'jk ph';
  d.textContent = '♫';
  d.title = id ? ('没有这张曲绘：' + id + '（游戏更新后重新提取一次即可补上）') : '没有曲绘';
  if (im.parentNode) im.parentNode.replaceChild(d, im);
}

function bindJacketFallback(root){
  var imgs = (root || document).querySelectorAll('img.jk[data-jk]');
  for (var i = 0; i < imgs.length; i++){
    (function(im){
      if (im.__jkBound) return;
      im.__jkBound = true;
      im.referrerPolicy = 'no-referrer';
      /* 用 addEventListener 而不是 im.onload=，否则会覆盖页面已有的 onload 逻辑 */
      im.addEventListener('load',  function(){ im.classList.add('jk-on'); });
      im.addEventListener('error', function(){ jkFail(im); });
      if (im.complete && im.naturalWidth === 0 && im.getAttribute('src')) jkFail(im);
    })(imgs[i]);
  }
}

function scoreRow(rank, title, diff, cc, score, p, id){
  return '<div class="song">'
    + '<div class="rank ' + (rank<=3?'top':'') + '">' + rank + '</div>'
    + jacketImg(id)
    + '<div class="ttl">' + title + '<div class="a">' + diffLabel(diff) + '</div></div>'
    + '<div class="cc">' + cc + '</div>'
    + '<div class="sc">' + fmt(score) + '<small>' + p.toFixed(3) + '</small></div>'
    + '</div>';
}

function computeBest(rows){
  var best = {};
  rows.forEach(function(r){
    var k = r.id + '|' + r.diff;
    if (!best[k] || r.score > best[k].score) best[k] = r;
  });
  return Object.keys(best).map(function(k){
    var r = best[k];
    return { song: r.song, diff: r.diff, cc: r.cc, score: r.score,
             pot: pot(r.cc + CONST_FIX, r.score),
             date: r.date, id: r.id };
  }).sort(function(a, b){ return b.pot - a.pot; }).slice(0, 30);
}

function computeRecent(rows){
  var cut = Date.now() - 30 * 864e5;
  var rec = [];
  rows.forEach(function(r){
    var t = Date.parse(r.date);
    if (!t || t < cut) return;
    rec.push({ song: r.song, diff: r.diff, cc: r.cc, score: r.score,
               pot: pot(r.cc + CONST_FIX, r.score),
               date: r.date, id: r.id });
  });
  rec.sort(function(a, b){ return b.pot - a.pot; });
  return rec.slice(0, 10);
}

function avgOf(list){
  if (!list.length) return 0;
  return list.reduce(function(s, x){ return s + x.pot; }, 0) / list.length;
}

function renderStats(rows, sm){
  if (!rows.length){
    $('#csvState').textContent = '没有解析到成绩行';
    return;
  }
  LAST.rows = rows; LAST.sm = sm || {};
  var b30 = computeBest(rows), r10 = computeRecent(rows);
  $('#b30avg').textContent = 'AVG ' + avgOf(b30).toFixed(3);
  $('#b30Body').innerHTML = b30.map(function(r, i){
    return scoreRow(i + 1, r.song || (sm[r.id] && sm[r.id].title) || r.id, r.diff, r.cc, r.score, r.pot, r.id);
  }).join('');
  $('#b30').classList.remove('hide');

  $('#r10avg').textContent = 'AVG ' + avgOf(r10).toFixed(3);
  $('#r10Body').innerHTML = r10.length
    ? r10.map(function(r, i){ return scoreRow(i + 1, r.song || (sm[r.id] && sm[r.id].title) || r.id, r.diff, r.cc, r.score, r.pot, r.id); }).join('')
    : '<div style="color:var(--dim)">最近 30 天无成绩</div>';
  $('#r10').classList.remove('hide');
  $('#csvState').textContent = rows.length + ' 条成绩已载入';
  bindJacketFallback();
}
</script>
<script>
function load(){
  hideErr();
  var tok = cleanToken($('#tok').value);
  if (!tok){ showErr('请先粘贴 a_t'); return; }
  var btn = $('#go'); btn.disabled = true; btn.textContent = '查询中...';
  localStorage.setItem('arcaea_token', tok);

  var smP = loadSongmap();

  api('/user/me', tok).then(function(me){
    if (!me || !me.success) throw new Error(JSON.stringify(me).slice(0, 220));
    var v = me.value;

    LAST.me = v;
    $('#pname').textContent = v.display_name || v.name || '—';
    $('#pcode').textContent = 'USER CODE ' + (v.user_code || '');
    $('#prating').textContent = (v.rating / 1000).toFixed(3);
    $('#profile').classList.remove('hide');

    return smP.then(function(sm){
      var rs = v.recent_score || [];
      $('#recentBody').innerHTML = rs.length
        ? rs.map(function(s, i){
            var info = sm[s.song_id] || {};
            var d = info.difficulties || {};
            var cc = d[String(s.difficulty)];
            var ccv = (cc == null) ? 0 : cc;
            return scoreRow(i + 1, info.title || s.song_id, s.difficulty,
                            cc == null ? '-' : cc, s.score, pot(ccv + CONST_FIX, s.score), s.song_id);
          }).join('')
        : '<div style="color:var(--dim)">暂无最近成绩</div>';
      $('#recent').classList.remove('hide');

      var rows = parseCSV($('#csv').value);
      if (rows.length) renderStats(rows, sm);
    });
  }).catch(function(e){
    showErr('查询失败: ' + (e && e.message ? e.message : e));
  }).then(function(){
    btn.disabled = false; btn.textContent = '查询';
  });
}

function calcOnly(){
  var rows = parseCSV($('#csv').value);
  if (!rows.length){ showErr('CSV 里没有解析到成绩'); return; }
  hideErr();
  loadSongmap().then(function(sm){ renderStats(rows, sm); });
}

function renderFromCsv(){
  var rows = parseCSV($('#csv').value);
  if (!rows.length) return;
  loadSongmap().then(function(sm){ renderStats(rows, sm); });
}

/* ===== 导出长图：纯 Canvas 绘制，不依赖任何第三方库 ===== */
var LAST = { rows: null, sm: {}, me: null };

function jacketSrc(id){
  if (!id) return '';
  if (typeof JACKETS !== 'undefined' && JACKETS[id]) return JACKETS[id];
  if (typeof LOCAL !== 'undefined' && LOCAL.__base) return LOCAL.__base + '/' + id + '.jpg';
  var pre = (typeof JK_PREFIX !== 'undefined') ? JK_PREFIX : 'jackets/';
  return pre + id + '.webp';
}

function imgLoad(src){
  return new Promise(function(res){
    if (!src) return res(null);
    var im = new Image();
    im.onload = function(){ res(im); };
    im.onerror = function(){ res(null); };
    im.src = src;
  });
}

function rrPath(c, x, y, w, h, r){
  c.beginPath();
  c.moveTo(x + r, y);
  c.lineTo(x + w - r, y);
  c.quadraticCurveTo(x + w, y, x + w, y + r);
  c.lineTo(x + w, y + h - r);
  c.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  c.lineTo(x + r, y + h);
  c.quadraticCurveTo(x, y + h, x, y + h - r);
  c.lineTo(x, y + r);
  c.quadraticCurveTo(x, y, x + r, y);
  c.closePath();
}

function drawCard(c, x, y, w, h){
  rrPath(c, x, y, w, h, 18);
  c.fillStyle = 'rgba(255,255,255,.045)';
  c.fill();
  c.strokeStyle = 'rgba(255,255,255,.085)';
  c.lineWidth = 1;
  c.stroke();
}

function clipText(c, text, max){
  if (c.measureText(text).width <= max) return text;
  var t = String(text);
  while (t.length > 1 && c.measureText(t + '…').width > max) t = t.slice(0, -1);
  return t + '…';
}

function drawJacket(c, im, x, y, s){
  c.save();
  rrPath(c, x, y, s, s, 8);
  c.clip();
  if (im){
    c.drawImage(im, x, y, s, s);
  } else {
    c.fillStyle = 'rgba(255,255,255,.07)';
    c.fillRect(x, y, s, s);
    c.fillStyle = 'rgba(255,255,255,.28)';
    c.font = '22px sans-serif';
    c.textAlign = 'center';
    c.textBaseline = 'middle';
    c.fillText('♫', x + s / 2, y + s / 2 + 1);
    c.textAlign = 'left';
    c.textBaseline = 'top';
  }
  c.restore();
}

function drawSongRow(c, x, y, w, r, rank, im, sm, opt){
  var mid = drawSongRow;
  var H = (mid._h || 66);

  // 名次
  c.font = '700 14px "Consolas",monospace';
  c.textAlign = 'right';
  c.textBaseline = 'middle';
  c.fillStyle = rank <= 3 ? '#f472b6' : 'rgba(255,255,255,.30)';
  c.fillText(String(rank), x + 40, y + H / 2);
  c.textAlign = 'left';

  // 封面
  var s = H - 12, cy = y + H / 2;
  drawJacket(c, im, x + 50, cy - s / 2, s);

  var info = (sm && sm[r.id]) || {};
  var title = r.song || info.title || r.id;
  var diff = diffLabel(r.diff);

  var scW = 118;
  var tx = x + 50 + s + 14;
  var tw = w - (tx - x) - scW - 22;

  // 定数 [10.7]
  c.font = '700 13px "Consolas","Microsoft YaHei",monospace';
  var ccTxt = '[' + (r.cc == null || r.cc === '' ? '-' : String(r.cc)) + ']';
  c.textBaseline = 'top'; c.textAlign = 'left';
  c.fillStyle = 'rgba(196,181,253,.85)';
  c.fillText(ccTxt, tx, y + 10);
  var cw2 = c.measureText(ccTxt).width;

  // 歌名
  c.font = '600 17px "Microsoft YaHei","Segoe UI",sans-serif';
  c.fillStyle = '#ece7ff';
  var mx = tx + cw2 + 7;
  c.fillText(clipText(c, title, tx + tw - mx), mx, y + 8);

  // 第二行：难度 + 判定
  c.font = '12px "Microsoft YaHei",sans-serif';
  c.fillStyle = 'rgba(255,255,255,.40)';
  c.fillText(diff, tx, y + 32);
  var dx = tx + c.measureText(diff).width + 10;

  var hasJudge = (typeof r.pure === 'number' && !isNaN(r.pure) && r.pure > 0);
  if (hasJudge){
    var base = '12px "Consolas","Segoe UI",monospace';
    c.font = base;
    c.fillStyle = 'rgba(255,255,255,.58)';
    var a1 = 'P' + r.pure;
    c.fillText(a1, dx, y + 32);
    var x2 = dx + c.measureText(a1).width;
    if (r.shiny > 0){
      c.fillStyle = 'rgba(196,181,253,.80)';
      var a2 = '+' + r.shiny;
      c.fillText(a2, x2, y + 32);
      x2 += c.measureText(a2).width;
    }
    c.fillStyle = 'rgba(255,255,255,.22)';
    c.fillText(' · ', x2, y + 32);
    var x3 = x2 + c.measureText(' · ').width;
    c.fillStyle = 'rgba(255,255,255,.50)';
    var a3 = 'F' + r.far;
    c.fillText(a3, x3, y + 32);
    var x4 = x3 + c.measureText(a3).width;
    c.fillStyle = 'rgba(255,255,255,.22)';
    c.fillText(' · ', x4, y + 32);
    var x5 = x4 + c.measureText(' · ').width;
    c.fillStyle = r.lost > 0 ? 'rgba(248,113,113,.78)' : 'rgba(255,255,255,.50)';
    c.fillText('L' + r.lost, x5, y + 32);
  }

  // 分数
  c.textAlign = 'right';
  c.textBaseline = 'top';
  c.font = '600 18px "Consolas","Segoe UI",monospace';
  c.fillStyle = '#ffffff';
  c.fillText(fmt(r.score), x + w - 10, y + 8);

  // 潜力
  c.font = '600 14px "Consolas",monospace';
  c.fillStyle = '#c4b5fd';
  c.fillText(r.pot.toFixed(3), x + w - 10, y + 31);

  c.textAlign = 'left';
}

// 统一块绘制：一列就列数=1，双列就列数=2
function drawBlock(c, x, y, w, list, cols, rowH, sm, imgs){
  var gap = 16;
  var colW = (w - gap * (cols - 1)) / cols;
  for (var i = 0; i < list.length; i++){
    var col = i % cols, row = Math.floor(i / cols);
    drawSongRow._h = rowH;
    drawSongRow(c, x + col * (colW + gap), y + row * rowH, colW, list[i], i + 1, imgs[list[i].id], sm);
  }
}

async function buildScoreImage(){
  var rows = (LAST.rows && LAST.rows.length) ? LAST.rows : parseCSV($('#csv').value);
  if (!rows || !rows.length) return null;
  var sm = LAST.sm || {};
  var me = LAST.me;
  var b30 = computeBest(rows);
  var r10 = computeRecent(rows);

  var recent = [];
  if (me && me.recent_score){
    recent = me.recent_score.map(function(s){
      var info = sm[s.song_id] || {};
      var d = info.difficulties || {};
      var cc = d[String(s.difficulty)];
      var ccv = (cc == null) ? 0 : cc;
      return { id: s.song_id, song: info.title || s.song_id, diff: s.difficulty,
               cc: (cc == null ? '-' : cc), score: s.score,
               pot: pot(ccv + CONST_FIX, s.score),
               shiny: s.shiny_perfect_count || 0,
               pure: (s.perfect_count != null ? s.perfect_count : (s.shiny_perfect_count || 0)),
               far: s.near_count || 0, lost: s.miss_count || 0 };
    });
  }

  // 预载所有曲绘
  var need = {};
  [b30, r10, recent].forEach(function(list){
    list.forEach(function(r){ if (r.id && !need[r.id]) need[r.id] = jacketSrc(r.id); });
  });
  var imgs = {};
  await Promise.all(Object.keys(need).map(function(id){
    return imgLoad(need[id]).then(function(im){ imgs[id] = im; });
  }));

  var W = 1080, PAD = 40, CW = W - PAD * 2, ROW = 74, HEAD = 54, GAP = 14;
  var COLS = 2;

  var hHead = 96;
  var hProf = me ? 132 : 0;
  var nRow = function(n){ return Math.ceil(n / COLS); };
  var hRec = recent.length ? HEAD + nRow(recent.length) * ROW + 12 : 0;
  var hB30 = b30.length ? HEAD + nRow(b30.length) * ROW + 12 : 0;
  var hR10 = r10.length ? HEAD + nRow(r10.length) * ROW + 12 : 0;
  var hFoot = 62;
  var H = 30 + hHead + GAP
        + (hProf ? hProf + GAP : 0)
        + (hRec ? hRec + GAP : 0)
        + (hB30 ? hB30 + GAP : 0)
        + (hR10 ? hR10 + GAP : 0)
        + hFoot;

  var cv = document.createElement('canvas');
  cv.width = W; cv.height = H;
  var c = cv.getContext('2d');

  // 背景渐变
  var bg = c.createLinearGradient(0, 0, W * 0.6, H);
  bg.addColorStop(0, '#15111f');
  bg.addColorStop(0.45, '#1b1529');
  bg.addColorStop(1, '#110e19');
  c.fillStyle = bg;
  c.fillRect(0, 0, W, H);

  // 顶部紫色光晕
  var glow = c.createRadialGradient(W * 0.5, -80, 0, W * 0.5, -80, W * 0.95);
  glow.addColorStop(0, 'rgba(139,92,246,.26)');
  glow.addColorStop(0.55, 'rgba(139,92,246,.07)');
  glow.addColorStop(1, 'rgba(139,92,246,0)');
  c.fillStyle = glow;
  c.fillRect(0, 0, W, 520);

  c.textBaseline = 'top';
  c.textAlign = 'left';
  var y = 30;

  // 标题
  c.font = 'bold 42px "Microsoft YaHei","Segoe UI",sans-serif';
  c.fillStyle = '#f0eaff';
  c.fillText('ARCAEA', PAD, y);
  var tw = c.measureText('ARCAEA').width;
  c.font = '600 22px "Microsoft YaHei",sans-serif';
  c.fillStyle = '#a78bfa';
  c.fillText('国服成绩', PAD + tw + 16, y + 16);
  c.font = '15px "Microsoft YaHei",sans-serif';
  c.fillStyle = 'rgba(255,255,255,.35)';
  c.fillText('BEST 30 + RECENT 10', PAD, y + 58);

  y += hHead;

  // 账号卡
  if (me){
    drawCard(c, PAD, y, CW, hProf);
    var av = 76, ax = PAD + 24, ay = y + (hProf - av) / 2;
    var ag = c.createLinearGradient(ax, ay, ax + av, ay + av);
    ag.addColorStop(0, '#8b5cf6');
    ag.addColorStop(1, '#ec4899');
    c.beginPath();
    c.arc(ax + av / 2, ay + av / 2, av / 2, 0, Math.PI * 2);
    c.fillStyle = ag;
    c.fill();
    c.fillStyle = '#fff';
    c.font = 'bold 36px sans-serif';
    c.textAlign = 'center';
    c.textBaseline = 'middle';
    c.fillText('✦', ax + av / 2, ay + av / 2 + 2);
    c.textAlign = 'left';
    c.textBaseline = 'top';

    c.fillStyle = '#fff';
    c.font = 'bold 30px "Microsoft YaHei","Segoe UI",sans-serif';
    c.fillText(me.display_name || me.name || '—', ax + av + 22, y + 30);
    c.font = '14px "Consolas",monospace';
    c.fillStyle = 'rgba(255,255,255,.42)';
    c.fillText('USER CODE ' + (me.user_code || ''), ax + av + 22, y + 76);

    c.textAlign = 'right';
    var rnum = ((me.rating || 0) / 1000).toFixed(3);
    c.font = 'bold 46px "Consolas","Segoe UI",monospace';
    var pg = c.createLinearGradient(W - PAD - 320, y, W - PAD - 40, y + hProf);
    pg.addColorStop(0, '#a78bfa');
    pg.addColorStop(1, '#f472b6');
    c.fillStyle = pg;
    c.fillText(rnum, W - PAD - 30, y + 26);
    c.font = '12px "Consolas",monospace';
    c.fillStyle = 'rgba(255,255,255,.38)';
    c.fillText('POTENTIAL', W - PAD - 30, y + 82);
    c.textAlign = 'left';
    y += hProf + GAP;
  }

  // 最近成绩
  if (recent.length){
    drawCard(c, PAD, y, CW, hRec);
    c.font = '600 20px "Microsoft YaHei",sans-serif';
    c.fillStyle = '#e9e3ff';
    c.fillText('最近成绩', PAD + 22, y + 18);
    drawBlock(c, PAD + 14, y + HEAD, CW - 28, recent, COLS, ROW, sm, imgs);
    y += hRec + GAP;
  }

  // BEST 30
  if (b30.length){
    drawCard(c, PAD, y, CW, hB30);
    c.font = '600 20px "Microsoft YaHei",sans-serif';
    c.fillStyle = '#e9e3ff';
    c.fillText('BEST 30', PAD + 22, y + 18);
    c.textAlign = 'right';
    c.font = 'bold 22px "Consolas",monospace';
    c.fillStyle = '#c4b5fd';
    c.fillText('AVG ' + avgOf(b30).toFixed(3), PAD + CW - 22, y + 17);
    c.textAlign = 'left';
    drawBlock(c, PAD + 14, y + HEAD, CW - 28, b30, COLS, ROW, sm, imgs);
    y += hB30 + GAP;
  }

  // RECENT 10
  if (r10.length){
    drawCard(c, PAD, y, CW, hR10);
    c.font = '600 20px "Microsoft YaHei",sans-serif';
    c.fillStyle = '#e9e3ff';
    c.fillText('RECENT 10', PAD + 22, y + 18);
    c.textAlign = 'right';
    c.font = 'bold 22px "Consolas",monospace';
    c.fillStyle = '#f9a8d4';
    c.fillText('AVG ' + avgOf(r10).toFixed(3), PAD + CW - 22, y + 17);
    c.textAlign = 'left';
    drawBlock(c, PAD + 14, y + HEAD, CW - 28, r10, COLS, ROW, sm, imgs);
    y += hR10 + GAP;
  }

  // 页脚
  c.font = '13px "Microsoft YaHei",sans-serif';
  c.fillStyle = 'rgba(255,255,255,.26)';
  c.fillText('定数已按 +0.4 修正 · B30/R10 为本地估算，官方 rating 以游戏内为准', PAD, y + 6);
  c.textAlign = 'right';
  c.fillText('曲绘版权归 lowiro 所有 · 仅用于曲目识别', W - PAD, y + 6);
  c.textAlign = 'left';

  return cv;
}

async function exportScoreImage(){
  var btn = $('#expImg');
  var old = btn ? btn.textContent : '';
  if (btn){ btn.disabled = true; btn.textContent = '生成中…'; }
  try {
    var cv = await buildScoreImage();
    if (!cv){ alert('没有成绩数据。先粘贴 CSV 或点「查询」。'); return; }
    var done = function(url, name){
      var a = document.createElement('a');
      a.href = url;
      a.download = name;
      document.body.appendChild(a);
      a.click();
      setTimeout(function(){ document.body.removeChild(a); }, 400);
    };
    var me = LAST.me;
    var name = 'arcaea-' + ((me && (me.name || me.display_name)) || 'score') + '.png';
    if (cv.toBlob){
      await new Promise(function(res){
        cv.toBlob(function(b){
          if (b) done(URL.createObjectURL(b), name);
          else done(cv.toDataURL('image/png'), name);
          res();
        }, 'image/png');
      });
    } else {
      done(cv.toDataURL('image/png'), name);
    }
  } catch (e) {
    alert('生成失败：' + (e && e.message ? e.message : e));
  } finally {
    if (btn){ btn.disabled = false; btn.textContent = old || '导出图片'; }
  }
}

/* ---------- 封面 zip 导入（原生 DecompressionStream，不依赖第三方库）---------- */
function readU16(b, o){ return b[o] | (b[o+1] << 8); }
function readU32(b, o){ return (b[o] | (b[o+1]<<8) | (b[o+2]<<16) | (b[o+3]<<24)) >>> 0; }

async function unzip(buf){
  var b = new Uint8Array(buf), out = [];
  var eocd = -1;
  for (var i = b.length - 22; i >= 0 && i > b.length - 66000; i--){
    if (readU32(b, i) === 0x06054b50){ eocd = i; break; }
  }
  if (eocd < 0) throw new Error('不是有效的 zip 文件');
  var n = readU16(b, eocd + 10), off = readU32(b, eocd + 16);
  var p = off;
  for (var k = 0; k < n; k++){
    if (readU32(b, p) !== 0x02014b50) break;
    var nameLen = readU16(b, p + 28), extraLen = readU16(b, p + 30), cmtLen = readU16(b, p + 32);
    var method = readU16(b, p + 10);
    var csize = readU32(b, p + 20);
    var lho = readU32(b, p + 42);
    var name = new TextDecoder().decode(b.subarray(p + 46, p + 46 + nameLen));
    var lnameLen = readU16(b, lho + 26), lextraLen = readU16(b, lho + 28);
    var dataStart = lho + 30 + lnameLen + lextraLen;
    var raw = b.subarray(dataStart, dataStart + csize);
    if (!name.endsWith('/')) out.push({ name: name, method: method, raw: raw });
    p += 46 + nameLen + extraLen + cmtLen;
  }
  var res = {};
  for (var j = 0; j < out.length; j++){
    var e = out[j];
    var bytes;
    if (e.method === 0) bytes = e.raw;
    else if (e.method === 8){
      var ds = new DecompressionStream('deflate-raw');
      var blob = await new Response(new Blob([e.raw]).stream().pipeThrough(ds)).arrayBuffer();
      bytes = new Uint8Array(blob);
    } else continue;
    var id = e.name.replace(/^.*\//, '').replace(/\.(jpg|jpeg|png)$/i, '');
    res[id] = 'data:image/jpeg;base64,' + b64(bytes);
  }
  return res;
}

function b64(u8){
  var CH = 0x8000, out = '';
  for (var i = 0; i < u8.length; i += CH){
    out += String.fromCharCode.apply(null, u8.subarray(i, i + CH));
  }
  return btoa(out);
}

function saveJackets(){
  try { sessionStorage.setItem('arcaea_jackets', JSON.stringify(JACKETS)); } catch(e){}
}
function loadLocalDir(){
  try {
    var v = localStorage.getItem('arcaea_localdir');
    if (!v) return 0;
    var m = JSON.parse(v);
    LOCAL = { __base: m.base || '' };
    return LOCAL.__base ? 1 : 0;
  } catch(e){ return 0; }
}
function setLocalDir(base){
  var b = (base || '').replace(/\/+$/, '');
  if (!b) { LOCAL = {}; localStorage.removeItem('arcaea_localdir'); return 0; }
  LOCAL = {};            // 懒生成：jacketImg 里按实际 id 拼路径
  LOCAL.__base = b;
  try { localStorage.setItem('arcaea_localdir', JSON.stringify({base: b})); } catch(e){}
  return 1;
}
function loadJackets(){
  loadLocalDir();
  try {
    var v = sessionStorage.getItem('arcaea_jackets');
    if (v) JACKETS = JSON.parse(v);
  } catch(e){ JACKETS = {}; }
  return Object.keys(JACKETS).length;
}

/* ---------- 封面导入按钮 ---------- */
function bindJackets(){
  var btn = document.getElementById('jkBtn');
  var file = document.getElementById('jkFile');
  if (!btn || !file) return;
  btn.onclick = function(){ file.click(); };
  file.onchange = async function(){
    var f = file.files && file.files[0];
    if (!f) return;
    var old = document.getElementById('csvState').textContent;
    document.getElementById('csvState').textContent = '正在解压封面…';
    try {
      var buf = await f.arrayBuffer();
      var imgs = await unzip(buf);
      var n = 0;
      Object.keys(imgs).forEach(function(k){ JACKETS[k] = imgs[k]; n++; });
      saveJackets();
      document.getElementById('csvState').textContent = '已导入 ' + n + ' 张封面';
      // 重绘当前列表
      if (document.getElementById('csv').value.trim()) renderFromCsv();
    } catch (e) {
      document.getElementById('csvState').textContent = '导入失败：' + e.message;
      console.error(e);
    }
  };
  // 选择本地曲绘目录（exe 导出的 jackets 文件夹）
  var dirBtn = document.getElementById('jkDirBtn');
  var dir = document.getElementById('jkDir');
  if (dirBtn && dir){
    dirBtn.onclick = function(){ dir.click(); };
    dir.onchange = function(){
      var fs = dir.files;
      if (!fs || !fs.length) return;
      // 用浏览器给的完整路径推出目录（只在本机 file:// 或本地服务下可用）
      var full = (fs[0].path || '').replace(/\\/g, '/');
      var dirPath = full ? full.substring(0, full.lastIndexOf('/')) : '';
      if (!dirPath){
        document.getElementById('csvState').textContent =
          '浏览器没给出完整路径，请直接打开本地 index.html（Ctrl+O）后再试';
        return;
      }
      setLocalDir('file:///' + dirPath);
      document.getElementById('csvState').textContent =
        '已绑定本地曲绘目录：' + dirPath + '（' + fs.length + ' 个文件）';
      if (document.getElementById('csv').value.trim()) renderFromCsv();
    };
  }
}
